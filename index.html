<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>দ্বীনি দোয়া ও আমল রিমাইন্ডার</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="দ্বীনি আমল" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="প্রতিটি নামাজের পরের আমল, মাসনূন দোয়া এবং সকাল-সন্ধ্যার জিকির রিমাইন্ডার ও ডিজিটাল তাসবীহ অ্যাপ।" />
    
    <!-- Google Fonts for Arabic & Bengali -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />
  </head>
  <body class="bg-slate-900 text-slate-100 font-bengali min-h-screen selection:bg-emerald-500 selection:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Register service worker for offline use
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
